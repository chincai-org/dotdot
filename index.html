<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<script>
			// Apply the stored theme before the stylesheet paints (FOUC guard).
			try {
				const saved = localStorage.getItem("dotdot.theme");
				if (saved === "light" || saved === "dark") {
					document.querySelector('meta[name="color-scheme"]').content = saved;
				}
			} catch {
				// Storage blocked: keep the system default.
			}
		</script>
		<title>Dot Dot</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<main>
			<div id="stage">
				<div id="board-wrap">
					<div id="board-pin">
						<canvas id="board" tabindex="0" aria-label="Dot placement board. Arrow keys move the cursor, Enter or Space places a stone, Shift plus arrow keys pan."></canvas>
					</div>
					<div id="board-spacer"></div>
				</div>

				<aside id="history" class="panel">
					<button
						id="history-tab"
						class="tab"
						type="button"
						aria-expanded="false"
						aria-controls="history-body"
						aria-label="Move history"
						aria-describedby="history-line"
						title="Show move history"
					>
						<span id="history-line">No moves</span>
					</button>
					<div id="history-body" class="panel-inner">
						<ol id="history-list" class="history-list"></ol>
					</div>
				</aside>

				<div id="coord" title="Cursor coordinate. Edit x or y to jump.">
					<label for="coord-x">x</label>
					<input
						id="coord-x"
						type="number"
						step="1"
						inputmode="numeric"
						autocomplete="off"
						value="0"
					>
					<span class="coord-sep" aria-hidden="true">·</span>
					<label for="coord-y">y</label>
					<input
						id="coord-y"
						type="number"
						step="1"
						inputmode="numeric"
						autocomplete="off"
						value="0"
					>
				</div>

				<div id="hud">
					<div id="controls" class="panel">
						<button
							id="controls-tab"
							class="tab"
							type="button"
							aria-expanded="false"
							aria-controls="controls-body"
							aria-label="Settings"
							aria-describedby="status"
							title="Show settings"
						>
							<span id="status" aria-live="polite">Red to play</span>
						</button>
						<div id="controls-body" class="panel-inner">
							<div class="settings">
								<div class="field">
									<label for="players">Players</label>
									<div class="stepper">
										<button
											id="players-dec"
											type="button"
											aria-label="Fewer players"
										>−</button>
										<input
											id="players"
											type="number"
											min="2"
											max="48"
											step="1"
											value="2"
											inputmode="numeric"
											autocomplete="off"
										>
										<button
											id="players-inc"
											type="button"
											aria-label="More players"
										>+</button>
									</div>
								</div>
								<div class="field">
									<label for="board-size">Board Size</label>
									<div class="stepper">
										<button
											id="board-dec"
											type="button"
											aria-label="Smaller board"
										>−</button>
										<input
											id="board-size"
											type="number"
											min="5"
											max="94000000"
											step="1"
											value="13"
											inputmode="numeric"
											autocomplete="off"
										>
										<button
											id="board-inc"
											type="button"
											aria-label="Larger board"
										>+</button>
									</div>
								</div>
							</div>
							<div class="actions">
								<button id="undo" type="button" disabled>Undo</button>
								<button id="clear" type="button" disabled>Clear</button>
								<button id="prefs-open" type="button">Preferences…</button>
							</div>
						</div>
					</div>

					<aside id="scores" class="panel">
						<button
							id="scores-tab"
							class="tab"
							type="button"
							aria-expanded="false"
							aria-controls="scores-body"
							aria-label="Scores"
							aria-describedby="leader-line"
							title="Show territory scores"
						>
							<span id="leader-dot" class="score-dot"></span>
							<span id="leader-line">No territory</span>
						</button>
						<div id="scores-body" class="panel-inner">
							<ol id="scores-list" class="scores-list"></ol>
						</div>
					</aside>
				</div>
			</div>
		</main>

		<dialog id="prefs" closedby="any" aria-labelledby="prefs-title">
			<div class="prefs-head">
				<h1 id="prefs-title">Preferences</h1>
				<form method="dialog" class="prefs-close-form">
					<button
						id="prefs-close"
						class="prefs-close"
						type="submit"
						value="close"
						aria-label="Close preferences"
					>×</button>
				</form>
			</div>

			<fieldset class="prefs-group">
				<legend>Theme</legend>
				<div class="theme-options">
					<label>
						<input
							id="theme-system"
							name="theme"
							type="radio"
							value="system"
							autofocus
						>
						System
					</label>
					<label>
						<input id="theme-light" name="theme" type="radio" value="light">
						Light
					</label>
					<label>
						<input id="theme-dark" name="theme" type="radio" value="dark">
						Dark
					</label>
				</div>
				<p id="theme-system-note" class="theme-note" aria-live="polite"></p>
			</fieldset>

			<fieldset class="prefs-group">
				<legend>Keyboard</legend>
				<div class="prefs-rows">
					<span>Move up</span>
					<button id="binding-up" class="binding" type="button"></button>
					<span>Move down</span>
					<button id="binding-down" class="binding" type="button"></button>
					<span>Move left</span>
					<button id="binding-left" class="binding" type="button"></button>
					<span>Move right</span>
					<button id="binding-right" class="binding" type="button"></button>
					<span>Pan up</span>
					<button id="binding-pan-up" class="binding" type="button"></button>
					<span>Pan down</span>
					<button id="binding-pan-down" class="binding" type="button"></button>
					<span>Pan left</span>
					<button id="binding-pan-left" class="binding" type="button"></button>
					<span>Pan right</span>
					<button id="binding-pan-right" class="binding" type="button"></button>
					<span>Place stone</span>
					<button id="binding-place" class="binding" type="button"></button>
					<span>Undo</span>
					<button id="binding-undo" class="binding" type="button"></button>
				</div>
				<p class="prefs-hint">
					Click a key, then press the new shortcut. Esc cancels.
					Shift+Arrow pans by default; Enter always places.
				</p>
				<p id="prefs-error" class="prefs-error" aria-live="polite"></p>
			</fieldset>

			<div class="prefs-actions">
				<button id="prefs-reset" type="button">Reset shortcuts</button>
				<form method="dialog">
					<button type="submit" value="done">Done</button>
				</form>
			</div>
		</dialog>

		<script src="main.js"></script>
	</body>
</html>
